name: sipila
services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./migrations:/app/migrations
      - ./appconfig.toml:/app/appconfig.toml:ro
    restart: unless-stopped
    environment:
      SECRET_KEY: "change-me-in-production"
      TZ: Asia/Jakarta
